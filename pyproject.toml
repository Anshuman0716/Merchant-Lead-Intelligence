[project]
name = "leadintel"
version = "0.1.0"
description = "Merchant Lead Intelligence Engine: tells a payments SDR which merchants to call first, why, and what to say."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.2",
    "selectolax>=0.3.21",
    "beautifulsoup4>=4.12",
    "polars>=1.0",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pandera[polars]>=0.20",
    "pyyaml>=6.0",
    "streamlit>=1.36",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
browser = ["playwright>=1.44"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadintel"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
